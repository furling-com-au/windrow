name: ci
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: typecheck sim
        run: npx tsc -p packages/sim --noEmit
      - name: unit tests (invariants, determinism, headless season)
        run: npm --workspace packages/sim run test
      - name: calibration smoke (headless 2025/26)
        run: npx tsx packages/sim/scripts/run_headless.ts 2025/26 42
      - name: svelte check
        run: npm --workspace app run check
      - name: build app
        run: npm --workspace app run build
      - name: playwright happy path
        working-directory: app
        # no --with-deps: the ubuntu-latest image already carries chromium's OS libs,
        # and --with-deps runs apt-get, which hung 24 min on a bad mirror (run 32231116155)
        timeout-minutes: 10
        run: |
          npx playwright install chromium
          npx playwright test
